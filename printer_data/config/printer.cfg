# *********************************
# * Printer config
# *********************************

[printer]
kinematics: delta
minimum_z_position: 0
max_velocity: 500
max_accel: 3000
max_z_velocity: 200
square_corner_velocity: 5
#delta_radius = 130
print_radius = 120

[firmware_retraction]
retract_length: 3
retract_speed: 40
unretract_speed: 40

# *********************************
# * Stepper config
# *********************************

[stepper_a]
step_pin: PC0
dir_pin: PB2
enable_pin: !PC13
endstop_pin: ^PA12
microsteps: 16
rotation_distance: 32
homing_speed: 60
homing_retract_dist: 32
#angle = 210.000000
#arm_length = 280.0
#position_endstop = 355.000000

[stepper_b]
step_pin: PC2
dir_pin: PB9
enable_pin: !PB12
endstop_pin: ^PA11
microsteps: 16
rotation_distance: 32
#angle = 330.000000
#arm_length = 280.0
#position_endstop = 355.000000

[stepper_c]
step_pin: PC14
dir_pin: PC15
enable_pin: !PB8
endstop_pin: ^PC6
microsteps: 16
rotation_distance: 32
#angle = 90.000000
#arm_length = 280.0
#position_endstop = 355.000000

[tmc2208 stepper_a]
uart_pin: PC7
run_current: 0.8
stealthchop_threshold: 999999 
interpolate: False 

[tmc2208 stepper_b]
uart_pin: PD2
stealthchop_threshold: 999999 
interpolate: False 
run_current: 0.8

[tmc2208 stepper_c]
uart_pin: PC12
stealthchop_threshold: 999999 
interpolate: False 
run_current: 0.8

[temperature_sensor MKS]
sensor_type: temperature_mcu
sensor_mcu: mcu

